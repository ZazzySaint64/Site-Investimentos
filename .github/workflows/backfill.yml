name: backfill
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers. Empty means all assets."
        required: false
      release:
        description: "Comma-separated TICKER:AAAA-MM-DD prices to accept despite the 50% rule."
        required: false
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: jobs
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run the full download
        env:
          TICKERS: ${{ inputs.tickers }}
          RELEASE: ${{ inputs.release }}
        run: |
          args=(--full)
          if [ -n "$TICKERS" ]; then args+=(--tickers "$TICKERS"); fi
          if [ -n "$RELEASE" ]; then args+=(--release "$RELEASE"); fi
          python -m pipeline.nightly "${args[@]}"
